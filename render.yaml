#  # who stayed silent through their whole grace window, asks their trusted
#  # contacts. Idempotent, so a missed or doubled run is harmless.
#  #
#  # Runs the service in-process rather than calling the API, so it works even
#  # when the free-tier web service is asleep and fails loudly (non-zero exit)
#  # instead of returning a 200 with an error inside.
#  #
#  # 12:00 UTC ≈ 7am Bogotá / 9am Buenos Aires / 2pm Madrid — a check-in email
#  # asking "¿sigues por aquí?" should not arrive in the middle of the night.
