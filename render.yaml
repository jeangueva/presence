services:
  - type: web
    name: presence-backend
    runtime: node
    plan: free
    rootDir: backend
    # El free tier construye dentro de 512 MB y `tsc` llegaba a 434 MB de pico,
    # justo por encima del margen: de ahí el "Ran out of memory".
    #  - `npm ci` es determinista y más liviano que `npm install`
    #  - `npm prune --omit=dev` quita typescript/tsx/@types (~35 MB) del runtime
    #  - NODE_OPTIONS (abajo) acota el heap de V8 para que recolecte en vez de
    #    crecer hasta que el contenedor lo mate
    buildCommand: npm ci && npm run build && npm prune --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Sin esto V8 crece hasta que Render mata el proceso. Aplica al build y
      # al runtime; 256 MB le sobran a un Express en una instancia de 512 MB.
      - key: NODE_OPTIONS
        value: "--max-old-space-size=256"
      # Render injects PORT automatically; our backend reads process.env.PORT.

      # --- Secrets: set these in Render dashboard (sync: false) ---
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d

      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: vault-files
      - key: STORAGE_PROVIDER
        value: supabase

      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6

      - key: GROQ_API_KEY
        sync: false
      - key: WHISPER_MODEL
        value: ""

      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

      # App Checkout API — Legado (pago único, via Bricks)
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false
      # Public key de la app Checkout API — la usa el Payment Brick en el navegador.
      - key: MERCADOPAGO_PUBLIC_KEY
        sync: false
      # App Suscripciones (Vault IA, mensual). Vacías = reutiliza las de arriba.
      - key: MERCADOPAGO_SUBSCRIPTION_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_SUBSCRIPTION_WEBHOOK_SECRET
        sync: false
      - key: MERCADOPAGO_CURRENCY
        value: COP
      # Legado is a one-time charge, Vault a monthly one. Local currency.
      - key: MERCADOPAGO_PRICE_LEGADO
        value: "396000"
      - key: MERCADOPAGO_PRICE_VAULT
        value: "48000"

      # FRONTEND_URL = tu URL de Cloudflare Pages (sin slash final).
      # BACKEND_PUBLIC_URL = la URL pública que Render le da a este service.
      # Ambas las llenas en el dashboard después del primer deploy.
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_PUBLIC_URL
        sync: false

      - key: ADMIN_TOKEN
        sync: false
      - key: SENTRY_DSN
        sync: false

      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX
        value: "100"

  # ---------------------------------------------------------------------------
  # El cron del dead-man's switch vive en Cloudflare Workers, no aquí:
  # los cron jobs de Render no están en el free tier, y un Cron Trigger de
  # Cloudflare es gratis y solo necesita hacer un fetch.
  #
  #   cd workers/deadman-cron && npm run deploy
